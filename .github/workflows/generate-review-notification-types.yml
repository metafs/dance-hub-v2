name: Generate review notification database types

on:
  push:
    branches: [feature/review-notifications-main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:types
      - uses: actions/upload-artifact@v4
        with:
          name: review-notification-database-types
          path: src/lib/database.types.ts
      - if: always()
        run: pnpm db:stop --no-backup
